<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduVentures</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Permanent+Marker&display=swap"
        rel="stylesheet">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --primary: hsl(230, 57%, 51%);
            --primary-hover: hsl(214, 56%, 58%);
            --background: hsl(197, 100%, 36%);
            --accent: hsl(243, 91%, 47%);
            --error: hsl(0, 100%, 50%);
            --success: hsl(120, 100%, 25%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-image: url('/placeholder.svg?height=1080&width=1920'), linear-gradient(to bottom, var(--primary-hover), var(--background));
            background-blend-mode: overlay;
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            opacity: 0.7;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            position: relative;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
        }

        .logo img {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        form {
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--primary);
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--primary);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 165, 0, 0.3);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }

        .toggle-form {
            text-align: center;
            margin-top: 1.5rem;
        }

        .toggle-form a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .toggle-form a:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .back-to-home {
            display: block;
            text-align: center;
            margin-top: 2rem;
        }

        .back-to-home button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .back-to-home button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }

        .popup {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            transform: translateY(-20px);
        }

        .popup.show {
            opacity: 1;
            transform: translateY(0);
        }

        .popup.success {
            background-color: var(--success);
            color: white;
        }

        .popup.error {
            background-color: var(--error);
            color: white;
        }

        .popup.welcome {
            background-color: var(--accent);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            animation: pulse 2s infinite;
        }

        .login-page {
            background-image: url("./assets/images/banner2.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-color: hsla(0, 0%, 0%, 0.5);
            background-blend-mode: overlay;
            min-height: 100vh;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body class="login-page">
    <div class="container">
        <div class="logo">
            <img src="favicon.svg" alt="EduVentures Logo" />
        </div>
        <h1 id="formTitle">Eduventure Awaits</h1>
        <form id="authForm">
            <div class="input-group" id="nameGroup">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Begin Your Journey</button>
        </form>
        <div class="toggle-form">
            <a href="#" id="toggleForm">Already an explorer? Sign In</a>
        </div>
        <div class="back-to-home">
            <button onclick="goToHome()">Back to Home</button>
        </div>
    </div>

    <div id="popup" class="popup"></div>

    <script>
        const formTitle = document.getElementById('formTitle');
        const authForm = document.getElementById('authForm');
        const nameGroup = document.getElementById('nameGroup');
        const toggleFormLink = document.getElementById('toggleForm');
        const submitButton = authForm.querySelector('button[type="submit"]');
        const popup = document.getElementById('popup');

        let isSignUp = true;

        function toggleForm() {
            isSignUp = !isSignUp;
            formTitle.textContent = isSignUp ? 'Eduventure Awaits' : 'Welcome Back, Explorer';
            nameGroup.style.display = isSignUp ? 'block' : 'none';
            submitButton.textContent = isSignUp ? 'Begin Your Journey' : 'Continue Adventure';
            toggleFormLink.textContent = isSignUp ? 'Already an explorer? Sign In' : 'New explorer? Sign Up';
        }

        function showPopup(message, type) {
            popup.textContent = message;
            popup.className = `popup ${type}`;
            popup.classList.add('show');
            setTimeout(() => {
                popup.classList.remove('show');
            }, 3000);
        }

        function goToHome() {
            window.location.href = 'index.html';
        }

        toggleFormLink.addEventListener('click', (e) => {
            e.preventDefault();
            toggleForm();
        });
        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(authForm);
            const userData = Object.fromEntries(formData.entries());
            if (isSignUp) {
                let users = JSON.parse(localStorage.getItem('users') || '[]');
                if (users.some(user => user.email === userData.email)) {
                    showPopup('This email is already registered. Please use a different email or sign in.', 'error');
                    return;
                }
                users.push(userData);
                localStorage.setItem('users', JSON.stringify(users));
                showPopup('You are now a registered explorer!', 'success');
                setTimeout(() => {
                    goToHome();
                }, 1500);
            } else {
                let users = JSON.parse(localStorage.getItem('users') || '[]');
                const user = users.find(u => u.email === userData.email && u.password === userData.password);
                if (user) {
                    const welcomeMessage = `Welcome back, ${user.name}! Your next adventure awaits.`;
                    showPopup(welcomeMessage, 'welcome');
                    console.log('Logged in user:', user);
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    const emailExists = users.some(u => u.email === userData.email);
                    if (emailExists) {
                        showPopup('Invalid password. Please try again.', 'error');
                    } else {
                        showPopup('Invalid email. Please check your email or sign up.', 'error');
                    }
                }
            }
            authForm.reset();
        });
    </script>
</body>

</html>
