<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EduVentures</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Permanent+Marker&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        /* CSS Variables for Theming */
        :root {
            --primary: hsl(230, 57%, 51%);
            --primary-hover: hsl(214, 56%, 58%);
            --primary-light: hsla(230, 57%, 51%, 0.1);
            --primary-dark: hsl(230, 57%, 41%);
            --background: hsl(197, 100%, 36%);
            --accent: hsl(243, 91%, 47%);
            --error: hsl(0, 100%, 50%);
            --success: hsl(120, 100%, 25%);
            --text-dark: hsl(230, 13%, 20%);
            --text-light: hsl(0, 0%, 100%);
            --text-muted: hsl(230, 13%, 40%);
            --border-radius: 12px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 16px 32px rgba(0, 0, 0, 0.2);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);

            /* Light Theme Default */
            --bg-main: hsl(0, 0%, 100%);
            --bg-surface: hsl(0, 0%, 98%);
            --text-color: var(--text-dark);
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        /* Dark Theme */
        .dark-mode {
            --bg-main: hsl(230, 13%, 10%);
            --bg-surface: hsl(230, 13%, 15%);
            --text-color: var(--text-light);
            --card-bg: rgba(30, 30, 40, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-image: url("./assets/images/banner2.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-color: hsla(0, 0%, 0%, 0.5);
            background-blend-mode: overlay;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            color: var(--text-color);
            transition: var(--transition);
            position: relative;
            overflow-x: hidden;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            width: 100%;
            max-width: 520px;
            /* Increased from 450px for better proportion */
            min-height: 600px;
            /* Added min-height to prevent shifting */
            padding: 3rem;
            position: relative;
            transition: var(--transition);
            transform: translateY(0);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 0 auto;
            /* Center container */
            display: flex;
            flex-direction: column;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .logo img {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
            transition: var(--transition);
        }

        .logo img:hover {
            transform: rotate(10deg) scale(1.1);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            position: relative;
            display: inline-block;
            width: 100%;
        }

        h1::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 4px;
            background: var(--primary);
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        form {
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            width: 100%;
            /* Ensure form takes full width */
            flex: 1;
            /* Allow form to grow */
        }

        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
            width: 100%;
            /* Ensure input groups take full width */
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-color);
            font-weight: 600;
            transition: var(--transition);
            font-size: 0.95rem;
        }

        .input-field {
            position: relative;
            width: 100%;
            /* Ensure input fields take full width */
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 3rem;
            /* Increased padding for better touch targets */
            border: 2px solid transparent;
            background-color: var(--primary-light);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
            color: var(--text-color);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(77, 140, 245, 0.2);
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            transition: var(--transition);
        }

        input:focus+.input-icon {
            color: var(--accent);
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .password-strength {
            height: 5px;
            margin-top: 8px;
            border-radius: 5px;
            background-color: #ddd;
            position: relative;
            overflow: hidden;
        }

        .password-strength-meter {
            height: 100%;
            width: 0;
            transition: width 0.3s ease;
        }

        .weak {
            background-color: var(--error);
            width: 33.33%;
        }

        .medium {
            background-color: orange;
            width: 66.66%;
        }

        .strong {
            background-color: var(--success);
            width: 100%;
        }

        .strength-text {
            font-size: 0.8rem;
            margin-top: 5px;
            text-align: right;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
            width: 100%;
            /* Ensure button takes full width */
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        button:hover::before {
            left: 100%;
        }

        .toggle-form {
            text-align: center;
            margin-top: 1.5rem;
            width: 100%;
            /* Ensure takes full width */
        }

        .toggle-form a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            position: relative;
        }

        .toggle-form a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background-color: var(--primary);
            transition: var(--transition);
        }

        .toggle-form a:hover {
            color: var(--accent);
        }

        .toggle-form a:hover::after {
            width: 100%;
        }

        .back-to-home {
            display: block;
            text-align: center;
            margin-top: 2rem;
            width: 100%;
            /* Ensure takes full width */
            position: relative;
            /* Ensure it stays in place */
        }

        .back-to-home button {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--primary);
            border-radius: var(--border-radius);
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: none;
            width: 100%;
            /* Ensure button takes full width */
            max-width: 300px;
            /* Limit maximum width */
            margin: 0 auto;
            /* Center the button */
        }

        .back-to-home button:hover {
            background-color: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .popup {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            opacity: 0;
            transition: var(--transition);
            z-index: 1000;
            transform: translateY(-20px);
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 90%;
            /* Prevent overflow on small screens */
        }

        .popup.show {
            opacity: 1;
            transform: translateY(0);
        }

        .popup.success {
            background-color: var(--success);
            color: white;
        }

        .popup.error {
            background-color: var(--error);
            color: white;
        }

        .social-login {
            margin-top: 2rem;
            text-align: center;
            width: 100%;
            /* Ensure takes full width */
        }

        .social-login p {
            margin-bottom: 1rem;
            position: relative;
        }

        .social-login p::before,
        .social-login p::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background-color: var(--text-muted);
        }

        .social-login p::before {
            left: 0;
        }

        .social-login p::after {
            right: 0;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            /* Allow wrapping on small screens */
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-light);
            color: var(--primary);
            transition: var(--transition);
            cursor: pointer;
        }

        .social-icon:hover {
            background-color: var(--primary);
            color: white;
            transform: translateY(-3px);
        }

        .theme-toggle {
            position: fixed;
            /* Changed from absolute to fixed */
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 100;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.2);
            transition: var(--transition);
        }

        .theme-toggle:hover {
            background-color: rgba(0, 0, 0, 0.4);
            transform: rotate(30deg);
        }

        .validation-message {
            font-size: 0.8rem;
            color: var(--error);
            margin-top: 0.25rem;
            display: none;
        }

        .input-group.error input {
            border-color: var(--error);
        }

        .input-group.error .validation-message {
            display: block;
        }

        /* Animation for form elements */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group,
        button,
        .toggle-form,
        .social-login {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .input-group:nth-child(1) {
            animation-delay: 0.1s;
        }

        .input-group:nth-child(2) {
            animation-delay: 0.2s;
        }

        .input-group:nth-child(3) {
            animation-delay: 0.3s;
        }

        button {
            animation-delay: 0.4s;
        }

        .toggle-form {
            animation-delay: 0.5s;
        }

        .social-login {
            animation-delay: 0.6s;
        }

        /* Loading animation */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, .3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive Design - Enhanced */
        @media (max-width: 768px) {
            .container {
                padding: 2.5rem;
                max-width: 90%;
                min-height: 580px;
            }
        }

        @media (max-width: 576px) {
            body {
                padding: 1rem;
            }

            .container {
                padding: 2rem 1.5rem;
                max-width: 100%;
                margin: 1rem;
                min-height: 550px;
            }

            h1 {
                font-size: 2rem;
            }

            .social-login p::before,
            .social-login p::after {
                width: 25%;
            }

            .theme-toggle {
                top: 10px;
                right: 10px;
            }
        }

        /* Fix for mobile landscape mode */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                height: auto;
                min-height: 100vh;
            }

            .container {
                margin: 2rem auto;
                min-height: 480px;
            }
        }
    </style>
</head>

<body>
    <button id="themeToggle" class="theme-toggle">
        <i class="fas fa-moon"></i>
    </button>

    <div class="container">
        <div class="logo">
            <img src="favicon.svg" alt="EduVentures Logo" />
        </div>
        <h1>Join the Adventure</h1>

        <form id="signupForm">
            <div class="input-group">
                <label for="name">Full Name</label>
                <div class="input-field">
                    <input type="text" id="name" name="name" required>
                    <i class="fas fa-user input-icon"></i>
                </div>
                <div class="validation-message">Please enter your full name</div>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-field">
                    <input type="email" id="email" name="email" required>
                    <i class="fas fa-envelope input-icon"></i>
                </div>
                <div class="validation-message">Please enter a valid email address</div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-field">
                    <input type="password" id="password" name="password" required>
                    <i class="fas fa-lock input-icon"></i>
                    <i class="fas fa-eye password-toggle" id="passwordToggle"></i>
                </div>
                <div class="password-strength">
                    <div class="password-strength-meter"></div>
                </div>
                <div class="strength-text"></div>
                <div class="validation-message">Password must be at least 8 characters</div>
            </div>

            <button type="submit" id="signupButton">
                <span>Begin Your Journey</span>
            </button>
        </form>

        <div class="toggle-form">
            <a href="/login">Already an explorer? Sign In</a>
        </div>

        <div class="social-login">
            <p>Or sign up with</p>
            <div class="social-icons">
                <div class="social-icon">
                    <i class="fab fa-google"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-facebook-f"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-twitter"></i>
                </div>
            </div>
        </div>

        <div class="back-to-home">
            <button onclick="goToHome()">Back to Home</button>
        </div>
    </div>

    <div id="popup" class="popup"></div>

    <script>
        // Theme Toggle Functionality
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('i');

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');

            if (document.body.classList.contains('dark-mode')) {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
                localStorage.setItem('theme', 'light');
            }
        });

        // Check for saved theme preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeIcon.classList.remove('fa-moon');
            themeIcon.classList.add('fa-sun');
        }

        // Password Toggle Functionality
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('password');

        passwordToggle.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordToggle.classList.remove('fa-eye');
                passwordToggle.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                passwordToggle.classList.remove('fa-eye-slash');
                passwordToggle.classList.add('fa-eye');
            }
        });

        // Password Strength Meter
        const strengthMeter = document.querySelector('.password-strength-meter');
        const strengthText = document.querySelector('.strength-text');

        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            const passwordGroup = passwordInput.closest('.input-group');

            if (val.length === 0) {
                strengthMeter.className = 'password-strength-meter';
                strengthText.textContent = '';
                return;
            }

            let strength = 0;

            // Check length
            if (val.length >= 8) strength += 1;

            // Check for mixed case
            if (val.match(/[a-z]/) && val.match(/[A-Z]/)) strength += 1;

            // Check for numbers
            if (val.match(/\d/)) strength += 1;

            // Check for special characters
            if (val.match(/[^a-zA-Z\d]/)) strength += 1;

            // Update UI based on strength
            switch (strength) {
                case 0:
                case 1:
                    strengthMeter.className = 'password-strength-meter weak';
                    strengthText.textContent = 'Weak';
                    strengthText.style.color = 'var(--error)';
                    break;
                case 2:
                case 3:
                    strengthMeter.className = 'password-strength-meter medium';
                    strengthText.textContent = 'Medium';
                    strengthText.style.color = 'orange';
                    break;
                case 4:
                    strengthMeter.className = 'password-strength-meter strong';
                    strengthText.textContent = 'Strong';
                    strengthText.style.color = 'var(--success)';
                    break;
            }

            // Validate password length
            if (val.length < 8) {
                passwordGroup.classList.add('error');
            } else {
                passwordGroup.classList.remove('error');
            }
        });

        // Form Validation
        const signupForm = document.getElementById('signupForm');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const signupButton = document.getElementById('signupButton');

        function validateEmail(email) {
            const re = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
            return re.test(String(email).toLowerCase());
        }

        function validateName(name) {
            return name.trim().length > 0;
        }

        function validatePassword(password) {
            return password.length >= 8;
        }

        nameInput.addEventListener('blur', () => {
            const nameGroup = nameInput.closest('.input-group');
            if (!validateName(nameInput.value)) {
                nameGroup.classList.add('error');
            } else {
                nameGroup.classList.remove('error');
            }
        });

        emailInput.addEventListener('blur', () => {
            const emailGroup = emailInput.closest('.input-group');
            if (!validateEmail(emailInput.value) && emailInput.value !== '') {
                emailGroup.classList.add('error');
            } else {
                emailGroup.classList.remove('error');
            }
        });

        // Show Popup Function
        function showPopup(message, type) {
            const popup = document.getElementById('popup');

            // Add icon based on type
            let icon = type === 'success' ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-exclamation-circle"></i>';

            popup.innerHTML = `${icon} ${message}`;
            popup.className = `popup ${type}`;
            popup.classList.add('show');

            setTimeout(() => {
                popup.classList.remove('show');
            }, 3000);
        }

        // Navigation Function
        function goToHome() {
            // Add loading animation to button
            const homeButton = document.querySelector('.back-to-home button');
            homeButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Redirecting...';

            setTimeout(() => {
                window.location.href = '/';
            }, 800);
        }

        // Form Submission with Loading State
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = nameInput.value;
            const email = emailInput.value;
            const password = passwordInput.value;

            // Validate form
            if (!validateName(name)) {
                showPopup('Please enter your full name', 'error');
                return;
            }

            if (!validateEmail(email)) {
                showPopup('Please enter a valid email address', 'error');
                return;
            }

            if (!validatePassword(password)) {
                showPopup('Password must be at least 8 characters', 'error');
                return;
            }

            // Show loading state
            signupButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
            signupButton.disabled = true;

            try {
                // Send signup request to server
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (data.success) {
                    showPopup('Registration successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1500);
                } else {
                    showPopup(data.message || 'Registration failed. Please try again.', 'error');
                    signupButton.innerHTML = 'Begin Your Journey';
                    signupButton.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                showPopup('An error occurred. Please try again.', 'error');
                signupButton.innerHTML = 'Begin Your Journey';
                signupButton.disabled = false;
            }
        });

        // Add subtle background animation
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;

            document.body.style.backgroundPosition = `${x * 10}% ${y * 10}%`;
        });

        // Adjust container height for small screens
        function adjustContainerHeight() {
            const container = document.querySelector('.container');
            const windowHeight = window.innerHeight;

            if (windowHeight < 600) {
                container.style.marginTop = '1rem';
                container.style.marginBottom = '1rem';
            } else {
                container.style.marginTop = '';
                container.style.marginBottom = '';
            }
        }

        // Run on load and resize
        window.addEventListener('load', adjustContainerHeight);
        window.addEventListener('resize', adjustContainerHeight);

        // Prevent input field shifting
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                // Add a class to the container to maintain its height
                document.querySelector('.container').classList.add('input-active');
            });

            input.addEventListener('blur', () => {
                document.querySelector('.container').classList.remove('input-active');
            });
        });
    </script>
</body>

</html>
