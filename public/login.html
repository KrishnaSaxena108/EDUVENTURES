<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduVentures</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Permanent+Marker&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
    <style>
        /* CSS Variables for Theming */
        :root {
            --primary: hsl(230, 57%, 51%);
            --primary-hover: hsl(214, 56%, 58%);
            --primary-light: hsla(230, 57%, 51%, 0.1);
            --primary-dark: hsl(230, 57%, 41%);
            --background: hsl(197, 100%, 36%);
            --accent: hsl(243, 91%, 47%);
            --error: hsl(0, 100%, 50%);
            --success: hsl(120, 100%, 25%);
            --text-dark: hsl(230, 13%, 20%);
            --text-light: hsl(0, 0%, 100%);
            --text-muted: hsl(230, 13%, 40%);
            --highlight-color: #4D8CF5;
            --border-radius: 12px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 16px 32px rgba(0, 0, 0, 0.2);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);

            /* Light Theme Default */
            --bg-main: hsl(0, 0%, 100%);
            --bg-surface: hsl(0, 0%, 98%);
            --text-color: var(--text-dark);
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        /* Dark Theme */
        .dark-mode {
            --bg-main: hsl(230, 13%, 10%);
            --bg-surface: hsl(230, 13%, 15%);
            --text-color: var(--text-light);
            --card-bg: rgba(30, 30, 40, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-image: url("./assets/images/banner2.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-color: hsla(0, 0%, 0%, 0.5);
            background-blend-mode: overlay;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            color: var(--text-color);
            transition: var(--transition);
            position: relative;
            overflow-x: hidden;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            width: 100%;
            max-width: 520px;
            /* Increased from 450px for better proportion */
            padding: 3rem;
            position: relative;
            transition: var(--transition);
            transform: translateY(0);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 0 auto;
            /* Center container */
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .logo img {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
            transition: var(--transition);
        }

        .logo img:hover {
            transform: rotate(10deg) scale(1.1);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            position: relative;
            display: inline-block;
            width: 100%;
        }

        h1::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 4px;
            background: var(--primary);
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        form {
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            width: 100%;
            /* Ensure form takes full width */
        }

        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
            width: 100%;
            /* Ensure input groups take full width */
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-color);
            font-weight: 600;
            transition: var(--transition);
            font-size: 0.95rem;
        }

        .input-field {
            position: relative;
            width: 100%;
            /* Ensure input fields take full width */
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 3rem;
            /* Increased padding for better touch targets */
            border: 2px solid transparent;
            background-color: var(--primary-light);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
            color: var(--text-color);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(77, 140, 245, 0.2);
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            transition: var(--transition);
        }

        input:focus+.input-icon {
            color: var(--accent);
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            flex-wrap: wrap;
            /* Allow wrapping on small screens */
            gap: 0.5rem;
            /* Add gap for when items wrap */
        }

        .remember-me {
            display: flex;
            align-items: center;
        }

        .remember-me input {
            width: auto;
            margin-right: 0.5rem;
        }

        .forgot-password {
            color: var(--primary);
            text-decoration: none;
            transition: var(--transition);
        }

        .forgot-password:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
            width: 100%;
            /* Ensure button takes full width */
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        button:hover::before {
            left: 100%;
        }

        .toggle-form {
            text-align: center;
            margin-top: 1.5rem;
            width: 100%;
            /* Ensure takes full width */
        }

        .toggle-form a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            position: relative;
        }

        .toggle-form a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background-color: var(--primary);
            transition: var(--transition);
        }

        .toggle-form a:hover {
            color: var(--accent);
        }

        .toggle-form a:hover::after {
            width: 100%;
        }

        .back-to-home {
            display: block;
            text-align: center;
            margin-top: 2rem;
            width: 100%;
            /* Ensure takes full width */
        }

        .back-to-home button {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--primary);
            border-radius: var(--border-radius);
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: none;
            width: 100%;
            /* Ensure button takes full width */
            max-width: 300px;
            /* Limit maximum width */
            margin: 0 auto;
            /* Center the button */
        }

        .back-to-home button:hover {
            background-color: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .popup {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            opacity: 0;
            transition: var(--transition);
            z-index: 1000;
            transform: translateY(-20px);
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 90%;
            /* Prevent overflow on small screens */
        }

        .popup.show {
            opacity: 1;
            transform: translateY(0);
        }

        .popup.success {
            background-color: var(--success);
            color: white;
        }

        .popup.error {
            background-color: var(--error);
            color: white;
        }

        .social-login {
            margin-top: 2rem;
            text-align: center;
            width: 100%;
            /* Ensure takes full width */
        }

        .social-login p {
            margin-bottom: 1rem;
            position: relative;
        }

        .social-login p::before,
        .social-login p::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background-color: var(--text-muted);
        }

        .social-login p::before {
            left: 0;
        }

        .social-login p::after {
            right: 0;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            /* Allow wrapping on small screens */
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-light);
            color: var(--primary);
            transition: var(--transition);
            cursor: pointer;
        }

        .social-icon:hover {
            background-color: var(--primary);
            color: white;
            transform: translateY(-3px);
        }

        .theme-toggle {
            position: fixed;
            /* Changed from absolute to fixed */
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 100;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.2);
            transition: var(--transition);
        }

        .theme-toggle:hover {
            background-color: rgba(0, 0, 0, 0.4);
            transform: rotate(30deg);
        }

        .validation-message {
            font-size: 0.8rem;
            color: var(--error);
            margin-top: 0.25rem;
            display: none;
        }

        .input-group.error input {
            border-color: var(--error);
        }

        .input-group.error .validation-message {
            display: block;
        }

        /* Animation for form elements */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group,
        button,
        .toggle-form,
        .social-login {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .input-group:nth-child(1) {
            animation-delay: 0.1s;
        }

        .input-group:nth-child(2) {
            animation-delay: 0.2s;
        }

        .remember-forgot {
            animation: fadeInUp 0.5s ease forwards;
            animation-delay: 0.3s;
            opacity: 0;
        }

        button {
            animation-delay: 0.4s;
        }

        .toggle-form {
            animation-delay: 0.5s;
        }

        .social-login {
            animation-delay: 0.6s;
        }

        /* Responsive Design - Enhanced */
        @media (max-width: 768px) {
            .container {
                padding: 2.5rem;
                max-width: 90%;
            }
        }

        @media (max-width: 576px) {
            body {
                padding: 1rem;
            }

            .container {
                padding: 2rem 1.5rem;
                max-width: 100%;
                margin: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .remember-forgot {
                flex-direction: column;
                align-items: flex-start;
            }

            .social-login p::before,
            .social-login p::after {
                width: 25%;
            }

            .theme-toggle {
                top: 10px;
                right: 10px;
            }
        }

        /* Fix for mobile landscape mode */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                height: auto;
                min-height: 100vh;
            }

            .container {
                margin: 2rem auto;
            }
        }

        /* ===== CHATBOT WIDGET STYLES ===== */
        .chatbot-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            font-family: 'Poppins', sans-serif;
        }

        /* Chatbot Toggle Button */
        .chatbot-toggle {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, var(--highlight-color), #6B9EFF);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(77, 140, 245, 0.4);
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }

        .chatbot-toggle::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .chatbot-toggle:hover::before {
            transform: translateX(100%);
        }

        .chatbot-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 35px rgba(77, 140, 245, 0.5);
        }

        .chatbot-toggle.active {
            background: linear-gradient(135deg, var(--secondary-background), var(--primary-background));
        }

        /* Chat Icon */
        .chat-icon {
            width: 32px;
            height: 32px;
            fill: white;
            transition: transform 0.3s ease;
        }

        .chatbot-toggle.active .chat-icon {
            transform: rotate(180deg);
        }

        /* Chatbot Container */
        .chatbot-container {
            position: absolute;
            bottom: 80px;
            right: 0;
            width: 400px;
            height: 550px;
            background: linear-gradient(135deg, var(--primary-background), var(--secondary-background));
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            transform: translateY(20px) scale(0.9);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(77, 140, 245, 0.3);
            overflow: hidden;
        }

        .chatbot-container.active {
            transform: translateY(0) scale(1);
            opacity: 1;
            visibility: visible;
        }

        /* Chatbot Header */
        .chatbot-header {
            background: linear-gradient(135deg, var(--highlight-color), #6B9EFF);
            padding: 20px;
            border-radius: 20px 20px 0 0;
            position: relative;
            overflow: hidden;
        }

        .chatbot-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.3;
        }

        .chatbot-header-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chatbot-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chatbot-avatar {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .chatbot-avatar svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .chatbot-details h3 {
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }

        .chatbot-details p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            margin: 2px 0 0 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4AFF4A;
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(1.2);
            }
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .close-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        /* Chatbot Content Area */
        .chatbot-content {
            height: calc(100% - 80px);
            padding: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Botpress iframe styling */
        .botpress-iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 0 0 20px 20px;
            background: transparent;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .chatbot-widget {
                bottom: 15px;
                right: 15px;
            }

            .chatbot-container {
                width: calc(100vw - 30px);
                height: 70vh;
                bottom: 80px;
                right: -10px;
            }

            .chatbot-toggle {
                width: 60px;
                height: 60px;
            }

            .chat-icon {
                width: 28px;
                height: 28px;
            }
        }

        /* Notification Badge */
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #FF4757;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-10px);
            }

            60% {
                transform: translateY(-5px);
            }
        }

        /* Hide Botpress branding and adjust styling */
        .chatbot-container iframe {
            border-radius: 0 0 20px 20px;
        }
    </style>
</head>

<body>
    <button id="themeToggle" class="theme-toggle">
        <i class="fas fa-moon"></i>
    </button>

    <div class="container">
        <div class="logo">
            <img src="../assets/images/favicon.svg" alt="EduVentures Logo" />
        </div>
        <h1>Welcome Back</h1>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-field">
                    <input type="email" id="email" name="email" required>
                    <i class="fas fa-envelope input-icon"></i>
                </div>
                <div class="validation-message">Please enter a valid email address</div>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-field">
                    <input type="password" id="password" name="password" required>
                    <i class="fas fa-lock input-icon"></i>
                    <i class="fas fa-eye password-toggle" id="passwordToggle"></i>
                </div>
                <div class="validation-message">Password must be at least 6 characters</div>
            </div>

            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" id="loginButton">
                <span>Continue Adventure</span>
            </button>
        </form>
        <div class="toggle-form">
            <a href="/signup">New explorer? Sign Up</a>
        </div>

        <div class="social-login">
            <p>Or continue with</p>
            <div class="social-icons">
                <div class="social-icon">
                    <i class="fab fa-google"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-facebook-f"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-twitter"></i>
                </div>
            </div>
        </div>

        <div class="back-to-home">
            <button onclick="goToHome()">Back to Home</button>
        </div>
    </div>

    <div id="popup" class="popup"></div>

    <!-- ===== CHATBOT WIDGET ===== -->
    <div class="chatbot-widget">
        <!-- Chatbot Container (Hidden by default) -->
        <div class="chatbot-container" id="chatbot-container">
            <!-- Chatbot Header -->
            <div class="chatbot-header">
                <div class="chatbot-header-content">
                    <div class="chatbot-info">
                        <div class="chatbot-details">
                            <h3>EduVentures Assistant</h3>
                            <p><span class="status-dot"></span> Online now</p>
                        </div>
                    </div>
                    <button class="close-btn" onclick="toggleChatbot()">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Chatbot Content - Botpress Integration -->
            <div class="chatbot-content">
                <iframe class="botpress-iframe"
                    src="https://cdn.botpress.cloud/webchat/v2.4/shareable.html?configUrl=https://files.bpcontent.cloud/2025/04/20/16/20250420161944-WK73YIAY.json"
                    title="EduVentures Chatbot" allow="microphone; camera" loading="lazy">
                </iframe>
            </div>
        </div>

        <!-- Chatbot Toggle Button -->
        <button class="chatbot-toggle" id="chatbot-toggle" onclick="toggleChatbot()">
            <span class="notification-badge" id="notification-badge">1</span>
            <img src="assets/images/favicon.svg" alt="EduVentures Assistant Avatar" height="65" width="65">
        </button>
    </div>

    <script>
        // Theme Toggle Functionality
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('i');

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');

            if (document.body.classList.contains('dark-mode')) {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
                localStorage.setItem('theme', 'light');
            }
        });

        // Check for saved theme preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeIcon.classList.remove('fa-moon');
            themeIcon.classList.add('fa-sun');
        }

        // Password Toggle Functionality
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('password');

        passwordToggle.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordToggle.classList.remove('fa-eye');
                passwordToggle.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                passwordToggle.classList.remove('fa-eye-slash');
                passwordToggle.classList.add('fa-eye');
            }
        });

        // Form Validation
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const loginButton = document.getElementById('loginButton');

        function validateEmail(email) {
            const re = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
            return re.test(String(email).toLowerCase());
        }

        function validatePassword(password) {
            return password.length >= 6;
        }

        emailInput.addEventListener('blur', () => {
            const emailGroup = emailInput.closest('.input-group');
            if (!validateEmail(emailInput.value) && emailInput.value !== '') {
                emailGroup.classList.add('error');
            } else {
                emailGroup.classList.remove('error');
            }
        });

        passwordInput.addEventListener('blur', () => {
            const passwordGroup = passwordInput.closest('.input-group');
            if (!validatePassword(passwordInput.value) && passwordInput.value !== '') {
                passwordGroup.classList.add('error');
            } else {
                passwordGroup.classList.remove('error');
            }
        });

        // Show Popup Function
        function showPopup(message, type) {
            const popup = document.getElementById('popup');

            // Add icon based on type
            let icon = type === 'success' ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-exclamation-circle"></i>';

            popup.innerHTML = `${icon} ${message}`;
            popup.className = `popup ${type}`;
            popup.classList.add('show');

            setTimeout(() => {
                popup.classList.remove('show');
            }, 3000);
        }

        // Navigation Function
        function goToHome() {
            // Add loading animation to button
            const homeButton = document.querySelector('.back-to-home button');
            homeButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Redirecting...';

            setTimeout(() => {
                window.location.href = '/';
            }, 800);
        }

        // Form Submission with Loading State
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value;
            const password = passwordInput.value;

            // Validate form
            if (!validateEmail(email)) {
                showPopup('Please enter a valid email address', 'error');
                return;
            }

            if (!validatePassword(password)) {
                showPopup('Password must be at least 6 characters', 'error');
                return;
            }

            // Show loading state
            loginButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            loginButton.disabled = true;

            try {
                // Send login request to server
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    showPopup('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1500);
                } else {
                    showPopup(data.message || 'Login failed. Please try again.', 'error');
                    loginButton.innerHTML = 'Continue Adventure';
                    loginButton.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                showPopup('An error occurred. Please try again.', 'error');
                loginButton.innerHTML = 'Continue Adventure';
                loginButton.disabled = false;
            }
        });

        // Add subtle background animation
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;

            document.body.style.backgroundPosition = `${x * 10}% ${y * 10}%`;
        });

        // Adjust container height for small screens
        function adjustContainerHeight() {
            const container = document.querySelector('.container');
            const windowHeight = window.innerHeight;

            if (windowHeight < 600) {
                container.style.marginTop = '1rem';
                container.style.marginBottom = '1rem';
            } else {
                container.style.marginTop = '';
                container.style.marginBottom = '';
            }
        }

        // Run on load and resize
        window.addEventListener('load', adjustContainerHeight);
        window.addEventListener('resize', adjustContainerHeight);

        // Prevent input field shifting
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                // Add a class to the container to maintain its height
                document.querySelector('.container').classList.add('input-active');
            });

            input.addEventListener('blur', () => {
                document.querySelector('.container').classList.remove('input-active');
            });
        });
    </script>

    <script>
        // ===== CHATBOT CONFIGURATION =====
        const CHATBOT_ENABLED = true; // Set to false to disable chatbot

        // Initialize chatbot
        initializeChatbot();
        ;

        // ===== CHATBOT FUNCTIONALITY =====
        let isChatbotOpen = false;

        function initializeChatbot() {
            const chatbotWidget = document.querySelector('.chatbot-widget');

            if (!CHATBOT_ENABLED) {
                chatbotWidget.style.display = 'none';
                return;
            }

            // Show notification badge after 5 seconds
            setTimeout(() => {
                if (!isChatbotOpen) {
                    const badge = document.getElementById('notification-badge');
                    if (badge) {
                        badge.style.animation = 'bounce 1s infinite';
                    }
                }
            }, 5000);

            // Auto-hide notification badge after 30 seconds
            setTimeout(() => {
                const badge = document.getElementById('notification-badge');
                if (badge && !isChatbotOpen) {
                    badge.style.display = 'none';
                }
            }, 30000);
        }

        function toggleChatbot() {
            if (!CHATBOT_ENABLED) return;

            const container = document.getElementById('chatbot-container');
            const toggle = document.getElementById('chatbot-toggle');
            const badge = document.getElementById('notification-badge');

            isChatbotOpen = !isChatbotOpen;

            container.classList.toggle('active', isChatbotOpen);
            toggle.classList.toggle('active', isChatbotOpen);

            // Hide notification badge when opened
            if (isChatbotOpen && badge) {
                badge.style.display = 'none';
            }

            // Add analytics tracking (optional)
            if (typeof gtag !== 'undefined') {
                gtag('event', isChatbotOpen ? 'chatbot_opened' : 'chatbot_closed', {
                    'event_category': 'engagement',
                    'event_label': 'chatbot_interaction'
                });
            }
        }

        // Close chatbot when clicking outside
        document.addEventListener('click', function (event) {
            if (!CHATBOT_ENABLED) return;

            const chatbotWidget = document.querySelector('.chatbot-widget');
            if (!chatbotWidget.contains(event.target) && isChatbotOpen) {
                toggleChatbot();
            }
        });

        // Handle escape key to close chatbot
        document.addEventListener('keydown', function (event) {
            if (!CHATBOT_ENABLED) return;

            if (event.key === 'Escape' && isChatbotOpen) {
                toggleChatbot();
            }
        });

        // Handle iframe load events
        window.addEventListener('message', function (event) {
            // Handle messages from Botpress iframe if needed
            if (event.origin === 'https://cdn.botpress.cloud') {
                // You can handle specific events from the chatbot here
                console.log('Chatbot message:', event.data);
            }
        });
    </script>
</body>
